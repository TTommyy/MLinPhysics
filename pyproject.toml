[project]
name = "physics-sim"
version = "0.1.0"
description = "Modular physics simulation framework with pluggable engines"
requires-python = ">=3.13.7, <3.14"
dependencies = [
    "arcade>=3.3.3",
    "base-conversion-kit>=1.0.7",
    "ffmpeg>=1.4",
    "ipykernel>=7.0.1",
    "ipynb>=0.5.1",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.7",
    "numba>=0.62.1",
    "numpy>=1.24.0",
    "pandas>=2.3.3",
    "plotly>=6.3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[tool.setuptools]
packages = ["physics_sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

[dependency-groups]
dev = [
    "watchfiles>=1.1.1",
]

